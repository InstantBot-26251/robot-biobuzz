# This attempts to assemble the code before merging pull requests to ensure that it can compile properly
name: Project Compile Check

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Run FTC Build Task
      run: ./gradlew :TeamCode:assembleDebug
